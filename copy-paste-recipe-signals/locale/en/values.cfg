nothing-to-copy-message=No signals were found in __1__ at __2__.\nTo copy signals, hold Shift and right-click:\n- An assembling machine or furnace (recipe)\n- A constant combinator\n- An inserter, transport belt, splitter or container (items)\n- A storage tank or pipe (fluids)
paste-failed-title=Nothing was pasted
no-item-signals=The copied signals contain no items, so nothing could be pasted onto __1__.\nTo copy items, hold Shift and right-click:\n- A constant combinator\n- An inserter, transport belt, splitter or container\n- An assembling machine or furnace (recipe)
paste-unsupported=Nothing could be pasted onto __1__.\nSupported paste targets:\n- Constant combinator (all signals)\n- Requester chest of any mod (all item signals)\n- Stack filter inserter, splitter (item filter)\n- Arithmetic/decider combinator (first signal)\n- Pump, inserter, transport belt, lamp (circuit condition)
